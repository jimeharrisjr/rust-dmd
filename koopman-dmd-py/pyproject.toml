[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "koopman-dmd"
version = "0.2.0"
description = "Dynamic Mode Decomposition with Koopman operator theory, powered by Rust"
readme = "README.md"
# PEP 639: an SPDX expression plus explicit license-files. Do not use the legacy
# `license = { text = "MIT" }` form — under Metadata 2.4 it emits a free-text
# `License:` field alongside `License-File:`, and PyPI then resolves the license
# path with legacy rules and rejects the upload with
# "License-File LICENSE does not exist in distribution file".
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Harris", email = "jimeharrisjr@gmail.com" }]
maintainers = [{ name = "James Harris", email = "jimeharrisjr@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy"]
keywords = [
    "dmd",
    "koopman",
    "dynamic-mode-decomposition",
    "dynamical-systems",
    "spectral-analysis",
    "time-series",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    # No "License :: OSI Approved ::" classifier — PEP 639 forbids pairing a
    # license classifier with a License-Expression, and PyPI rejects the combination.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://jimeharrisjr.github.io/rust-dmd/"
Repository = "https://github.com/jimeharrisjr/rust-dmd"
Issues = "https://github.com/jimeharrisjr/rust-dmd/issues"
Changelog = "https://github.com/jimeharrisjr/rust-dmd/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
