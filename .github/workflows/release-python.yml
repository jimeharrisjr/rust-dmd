name: Release Python

# Builds wheels and an sdist for koopman-dmd and publishes them to PyPI.
#
# Triggered by pushing a tag like `py-v0.1.0`, or manually via workflow_dispatch
# (which builds and uploads artifacts but publishes only if `publish` is set).
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token is stored. The
# publisher must be configured at https://pypi.org/manage/project/koopman-dmd/settings/publishing/
# for this repository, workflow filename `release-python.yml`, and environment `pypi`.

on:
  push:
    tags:
      - "py-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to publish the built artifacts"
        required: true
        default: "none"
        type: choice
        options: [none, testpypi, pypi]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Single abi3 wheel per platform covers all supported Python versions.
  PYTHON_VERSION: "3.11"

jobs:
  wheels:
    name: Wheel (${{ matrix.platform.target }} on ${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # `native: true` means the wheel can execute on this runner, so it gets
        # smoke-tested. Cross-compiled wheels are built and checked but not run.
        platform:
          - { os: ubuntu-latest,  target: x86_64,  manylinux: auto, native: true }
          - { os: ubuntu-latest,  target: aarch64, manylinux: auto, native: false }
          - { os: macos-latest,   target: aarch64, manylinux: "",   native: true }
          - { os: macos-latest,   target: x86_64,  manylinux: "",   native: false }
          - { os: windows-latest, target: x64,     manylinux: "",   native: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # `auto` cross-compiles aarch64 Linux inside a manylinux container.
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
          working-directory: koopman-dmd-py
          sccache: "true"
      - name: Verify wheel metadata
        run: |
          python -m pip install --upgrade twine
          twine check koopman-dmd-py/dist/*
      - name: Smoke-test the built wheel
        if: matrix.platform.native
        working-directory: koopman-dmd-py
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install --no-index --find-links dist koopman-dmd
          python -c "import koopman_dmd; print('import OK')"
          python -m pytest tests/ -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: koopman-dmd-py/dist/*

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: koopman-dmd-py
      - name: Verify sdist builds from source
        run: |
          python -m pip install --upgrade pip twine
          twine check koopman-dmd-py/dist/*
          python -m pip install --no-binary :all: koopman-dmd-py/dist/*.tar.gz
          python -c "import koopman_dmd; print('sdist build OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: koopman-dmd-py/dist/*

  publish:
    name: Publish to ${{ github.event_name == 'push' && 'PyPI' || inputs.publish }}
    needs: [wheels, sdist]
    if: github.event_name == 'push' || inputs.publish != 'none'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'push' || inputs.publish == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      # Required for Trusted Publishing (OIDC). No API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.publish == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
