name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p koopman-dmd -- -D warnings --allow clippy::needless_range_loop --allow clippy::manual_clamp --allow clippy::too_many_arguments
      - name: Build
        run: cargo build -p koopman-dmd
      - name: Test
        run: cargo test -p koopman-dmd
      - name: Verify package contents
        run: cargo package -p koopman-dmd --list
      - name: Doc
        run: cargo doc -p koopman-dmd --no-deps

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read declared MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' koopman-dmd/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # Build the crate standalone with a fresh resolve, so this tests what a downstream
      # user actually gets from `cargo add koopman-dmd` rather than our pinned workspace lock.
      - name: Build at MSRV with a fresh resolve
        run: |
          cp -r koopman-dmd "${RUNNER_TEMP}/msrv-check"
          cd "${RUNNER_TEMP}/msrv-check"
          printf '\n[workspace]\n' >> Cargo.toml
          rm -f Cargo.lock
          cargo build

  python:
    name: Python Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy
      - name: Build and install
        working-directory: koopman-dmd-py
        run: |
          . ../.venv/bin/activate
          maturin develop
      - name: Test
        working-directory: koopman-dmd-py
        run: |
          . ../.venv/bin/activate
          pytest tests/ -v

  r:
    name: R Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          # Use Posit Package Manager, which serves prebuilt Linux binaries. Installing
          # from cloud.r-project.org forces a source build, and fs (>= 2.1.0) needs libuv
          # headers that the runner does not carry — which breaks testthat via pkgload.
          use-public-rspm: true
      - name: Install R dependencies
        run: Rscript -e 'install.packages("testthat")'
      - name: Install package
        run: R CMD INSTALL koopman-dmd-r
      - name: Test
        working-directory: koopman-dmd-r
        run: Rscript -e 'library(testthat); library(koopman.dmd); test_dir("tests/testthat")'
